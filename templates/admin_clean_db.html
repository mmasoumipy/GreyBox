<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Database Clean</title>
    <style>
      :root {
        --bg: #f5f3ef;
        --card: #ffffff;
        --text: #1b1b1b;
        --muted: #6a6a6a;
        --accent: #b84a2b;
        --border: #e3e0db;
        --ok: #1f7a3a;
        --err: #b42318;
      }
      body {
        font-family: "Georgia", "Times New Roman", serif;
        background: radial-gradient(circle at 20% 20%, #fff6e9, var(--bg));
        color: var(--text);
        margin: 0;
        padding: 40px 16px;
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 28px;
        border-radius: 12px;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 28px;
        letter-spacing: 0.2px;
      }
      p {
        margin: 0 0 16px 0;
        color: var(--muted);
        line-height: 1.5;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 16px;
      }
      .hint {
        margin-top: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .actions {
        margin-top: 18px;
      }
      button {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 12px 18px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
      }
      .status {
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 8px;
        font-weight: 600;
      }
      .status.info {
        background: #f2ede7;
        color: var(--text);
      }
      .status.success {
        background: #e7f5ec;
        color: var(--ok);
      }
      .status.error {
        background: #fdecea;
        color: var(--err);
      }
      code {
        background: #f2ede7;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>Clean Study Logs</h1>
        <p>
          This will remove all records from <strong>study_logs</strong> and delete any local
          log files. This action cannot be undone.
        </p>
        <form method="post">
          <label for="confirm">Type the confirmation token</label>
          <input id="confirm" name="confirm" type="text" autocomplete="off" />
          <div class="hint">Token: <code>{{ confirmation_token }}</code></div>
          <div class="actions">
            <button type="submit">Clean Database</button>
          </div>
        </form>
        {% if message %}
        <div class="status {{ status }}">{{ message }}</div>
        {% endif %}
      </div>
    </div>
  </body>
</html>
