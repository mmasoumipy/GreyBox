<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200">
  <defs>
    <style>
      @font-face { font-family: ui-mono; src: local("SFMono-Regular"), local("Menlo"), local("Consolas"), local("Liberation Mono"), local("Monaco"), local("monospace"); }
      .screen { fill: #0b0f14; }
      .frame { fill: #1f2937; }
      .btn { rx: 6; }
      .txt { font-family: ui-mono, monospace; font-size: 22px; fill: #e5e7eb; }
      .cursor { fill: #e5e7eb; }
    </style>

    <!-- Use clipPath instead of mask -->
    <clipPath id="clip1" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width" from="0" to="600" dur="2s" fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="clip2" clipPathUnits="userSpaceOnUse">
      <rect x="0" y="0" width="0" height="200">
        <animate attributeName="width" from="0" to="480" dur="1.4s" begin="2.2s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="960" height="200" class="frame" rx="14"/>
  <rect x="20" y="24" width="18" height="18" fill="#ef4444" class="btn"/>
  <rect x="44" y="24" width="18" height="18" fill="#f59e0b" class="btn"/>
  <rect x="68" y="24" width="18" height="18" fill="#10b981" class="btn"/>
  <rect x="12" y="58" width="936" height="130" class="screen" rx="10"/>

  <!-- Line 1 -->
  <g transform="translate(30,95)" class="txt" clip-path="url(#clip1)">
    <text x="0" y="0" dominant-baseline="hanging">$ echo "Hello World! This is Mina"</text>
  </g>

  <rect x="30" y="77" width="12" height="24" class="cursor">
    <animate attributeName="x" from="30" to="630" dur="2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0" dur="0.1s" begin="2s" fill="freeze"/>
  </rect>

  <!-- Line 2 -->
  <g transform="translate(30,128)" class="txt" clip-path="url(#clip2)">
    <text x="0" y="0" dominant-baseline="hanging">Hello World! This is Mina</text>
  </g>

  <rect x="30" y="110" width="12" height="24" class="cursor" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.1s" begin="2.2s" fill="freeze"/>
    <animate attributeName="x" from="30" to="510" dur="1.4s" begin="2.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
